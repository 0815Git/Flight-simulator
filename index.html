<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Flight Simulator</title>
  <link rel="icon" href="./assets/icon.png">
  <style>
    /* Roboto, bundled locally (Apache-2.0) so it works offline — variable
       weight file covers the 400 & 500 used by the HUD. */
    @font-face {
      font-family: 'Roboto';
      font-style: normal;
      font-weight: 100 900;
      font-display: swap;
      src: url('./assets/roboto-latin.woff2') format('woff2');
    }
    html, body { margin: 0; height: 100%; background: #66bfff; overflow: hidden; font-family: system-ui, sans-serif; }
    #threetiles {
      display: block; width: 100%; height: 100%; outline: none;
      touch-action: none; user-select: none; -webkit-user-select: none;
    }
    .text { position: absolute; color: var(--hud); white-space: pre; pointer-events: none;
            text-shadow: 0 1px 2px rgba(0,0,0,.6); }
    #loading { left: 0; right: 0; text-align: center; top: 45%; font-size: 42px; }
    #crash { left: 0; right: 0; text-align: center; top: 40%; font-size: 36px; display: none; }

    /* Score panel, top-right — small: score + rings */
    #scorebar {
      position: fixed; right: 12px; top: 12px;
      display: none; align-items: center; gap: 11px;
      padding: 6px 12px; border-radius: 10px;
      background: rgba(0, 12, 4, .45); backdrop-filter: blur(6px);
      border: 1px solid var(--hud);
      color: var(--hud); text-shadow: 0 0 3px var(--hud-glow), 0 1px 2px rgba(0, 0, 0, .6);
      font-family: 'Roboto', system-ui, sans-serif;
    }
    #scorebar .val { font-size: 15px; font-weight: 700; line-height: 1; }
    #scorebar .label { font-size: 8px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin-top: 2px; }
    #scorebar .divider { width: 1px; height: 20px; background: var(--hud); opacity: .5; }

    /* F-15 style HUD symbology colour — phosphor green, with a faint glow. */
    :root { --hud: #3dff5c; --hud-glow: rgba(61, 255, 92, .45); }

    /* Airspeed (left) & altitude (right) moving-scale tapes, set well out from
       the centre symbology like a fighter HUD. Drawn on canvases in main.ts. */
    .tape {
      position: fixed; top: 50%; transform: translateY(-50%);
      width: 110px; height: min(44vh, 300px);
      display: none; z-index: 5; pointer-events: none;
      filter: drop-shadow(0 0 2px var(--hud-glow));
    }
    /* …but never pushed past an 8px margin on narrow (portrait) screens */
    #spdTape { right: min(calc(50% + min(24vw, 330px)), calc(100% - 118px)); }
    #altTape { left: min(calc(50% + min(24vw, 330px)), calc(100% - 118px)); }

    /* Compass heading tape, top-center. Ticks every 10° (major every 30° with a
       label), a fixed center pointer + big current-heading readout. Drawn on a
       canvas in main.ts; this only sizes/places it. */
    #compass {
      position: fixed; left: 50%; top: 8px; transform: translateX(-50%);
      width: min(92vw, 560px); height: 80px;
      display: none; z-index: 5; pointer-events: none;
      filter: drop-shadow(0 0 2px var(--hud-glow));
    }

    /* transient "+5 / +10" popup */
    #pop {
      position: fixed; left: 50%; top: 88px; transform: translateX(-50%);
      font-size: 40px; font-weight: 800; color: var(--hud); opacity: 0;
      text-shadow: 0 2px 8px rgba(0, 0, 0, .6); pointer-events: none;
      transition: opacity .15s ease-out;
    }

    /* Target designator: HUD brackets around the next ring(s) to fly through */
    #designator {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: none; pointer-events: none; z-index: 4;
      filter: drop-shadow(0 0 2px var(--hud-glow));
    }

    /* Attitude symbology: W aircraft datum, flight path marker, horizon line
       and pitch ladder — drawn on a full-screen canvas in main.ts. */
    #attitude {
      position: fixed; inset: 0; width: 100%; height: 100%;
      display: none; pointer-events: none; z-index: 5;
      filter: drop-shadow(0 0 2px var(--hud-glow));
    }

    /* Login overlay — flight-instrument themed, see design spec */
    #login {
      position: fixed; inset: 0; z-index: 10;
      display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
      box-sizing: border-box;
      overflow: auto;                 /* short screens: keep fields reachable */
      background: #0B1220;
      direction: ltr;
    }
    /* Decorative attitude-indicator symbology behind the card */
    #loginBg {
      position: absolute; inset: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
    }
    #login .card {
      position: relative; z-index: 1;
      width: 100%; max-width: 510px; box-sizing: border-box;
      padding: 36px;
      background: #141E2D;
      border: 1px solid #303C4D;
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45);
      color: #F4F7FC;
      text-align: left;
      font-family: 'Roboto', system-ui, sans-serif;
    }
    #login .planeIcon { display: block; width: 48px; height: 48px; color: #398BFA; }
    #login h1 {
      margin: 18px 0 0; font-size: 36px; font-weight: 700;
      line-height: 1.2; color: #F4F7FC; letter-spacing: 0;
    }
    #login .sub { margin: 8px 0 0; font-size: 18px; font-weight: 400; color: #98A6B9; }
    #login .fields { margin-top: 28px; }
    #login label {
      display: block; font-size: 16px; color: #CDD5E1; margin-bottom: 8px;
    }
    #login .field + .field { margin-top: 22px; }
    #login input {
      display: block; width: 100%; box-sizing: border-box;
      height: 50px; padding: 0 14px; margin: 0;
      font: inherit; font-size: 16px; color: #F4F7FC;
      background: #0F1724;
      border: 1px solid #3B485A; border-radius: 8px;
      outline: none; transition: border-color .15s, box-shadow .15s;
    }
    #login input:focus-visible,
    #login input:focus {
      border-color: #398BFA; box-shadow: 0 0 0 3px rgba(57, 139, 250, .25);
    }
    #login .err { color: #ff9a9a; font-size: 14px; margin: 12px 0 0; }
    #login .err:empty { display: none; }
    #login button {
      display: block; width: 100%; height: 54px; margin-top: 30px; padding: 0;
      font-family: inherit; font-size: 18px; font-weight: 600; color: #fff;
      cursor: pointer; background: #398BFA;
      border: none; border-radius: 8px;
      transition: background .15s, transform .05s, box-shadow .15s;
    }
    #login button:hover:not(:disabled) { background: #4C97FB; }
    #login button:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(57, 139, 250, .4); }
    #login button:active:not(:disabled) { background: #2E7BE0; transform: translateY(1px); }
    #login button:disabled { background: #2B3F5C; color: #9FB3CC; cursor: default; }
    /* Region segmented control on the login card */
    #login .label { display: block; font-size: 16px; color: #CDD5E1; margin-bottom: 8px; }
    #login .seg { display: flex; gap: 10px; }
    #login .segBtn {
      flex: 1; height: 50px; margin: 0; padding: 0;
      font-family: inherit; font-size: 16px; font-weight: 600; color: #CDD5E1;
      background: #0F1724; border: 1px solid #3B485A; border-radius: 8px;
      cursor: pointer; transition: background .15s, border-color .15s, color .15s;
    }
    #login .segBtn:hover { border-color: #55657b; }
    #login .segBtn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(57, 139, 250, .35); }
    #login .segBtn.is-on { background: #16304f; border-color: #398BFA; color: #F4F7FC; }

    /* Pause / finish dialogs — shown over a frozen simulator */
    .modal {
      position: fixed; inset: 0; z-index: 30; display: none;
      align-items: center; justify-content: center; padding: 24px 16px;
      box-sizing: border-box; background: rgba(6, 12, 22, .72);
      font-family: 'Roboto', system-ui, sans-serif; direction: ltr;
    }
    .modal.is-open { display: flex; }
    .modalCard {
      width: 100%; max-width: 440px; box-sizing: border-box; padding: 28px;
      background: #141E2D; border: 1px solid #303C4D; border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .5); color: #F4F7FC; text-align: left;
    }
    .modalCard h2 { margin: 0 0 10px; font-size: 24px; font-weight: 700; }
    .modalInfo { margin: 0 0 18px; font-size: 15px; line-height: 1.55; color: #98A6B9; white-space: pre-line; }
    .modalAsk { margin: 0 0 20px; font-size: 17px; color: #F4F7FC; }
    .modalRow { display: flex; gap: 12px; }
    /* Secondary row (the CSV export): same width, visually quieter. */
    .modalRowCsv { margin-top: 10px; }
    .modalRowCsv .btnGhost { height: 42px; font-size: 15px; font-weight: 500; }
    .btnGhost:disabled { opacity: .4; cursor: default; }
    .btnGhost:disabled:hover { border-color: #3B485A; color: #CDD5E1; }
    .btnPrimary, .btnGhost {
      flex: 1; height: 50px; font-family: inherit; font-size: 17px; font-weight: 600;
      border-radius: 8px; cursor: pointer; transition: background .15s, transform .05s;
    }
    .btnPrimary { color: #fff; background: #398BFA; border: none; }
    .btnPrimary:hover { background: #4C97FB; }
    .btnPrimary:active { transform: translateY(1px); }
    .btnGhost { color: #CDD5E1; background: transparent; border: 1px solid #3B485A; }
    .btnGhost:hover { border-color: #55657b; color: #F4F7FC; }
    .btnGhost:active { transform: translateY(1px); }
    .btnPrimary:focus-visible, .btnGhost:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(57, 139, 250, .4); }

    @media (max-width: 560px) {
      #login .card { padding: 24px; }
      #login h1 { font-size: 30px; }
      #login .sub { font-size: 16px; }
    }
  </style>
</head>
<body>
  <canvas id="threetiles" tabindex="0"></canvas>

  <div id="loading" class="text">Loading terrain… 0%</div>
  <div id="crash" class="text">You crashed! Press E to continue (−30) or R to restart.</div>

  <div id="scorebar">
    <div>
      <div class="val" id="scoreVal">0</div>
      <div class="label">Score</div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="val" id="ringsVal">0 / 0</div>
      <div class="label">Rings</div>
    </div>
    <div class="divider"></div>
    <div>
      <div class="val" id="routeVal">1</div>
      <div class="label">Route</div>
    </div>
  </div>
  <div id="pop"></div>

  <canvas id="compass"></canvas>
  <canvas id="designator"></canvas>

  <canvas id="spdTape" class="tape"></canvas>
  <canvas id="altTape" class="tape"></canvas>

  <canvas id="attitude"></canvas>

  <div id="login">
    <!-- Decorative attitude/pitch-ladder symbology. Purely visual. -->
    <svg id="loginBg" viewBox="0 0 1680 940" preserveAspectRatio="xMidYMid slice"
         aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
      <g fill="none" stroke="#223346" stroke-width="2" stroke-linecap="round">
        <!-- roll-scale arc + centre pointer -->
        <path d="M 416 510 A 420 420 0 0 1 1256 510" stroke-width="2.5"/>
        <path d="M 836 30 L 836 905"/>
        <path d="M 812 62 L 860 62 L 836 94 Z" stroke-width="2.5"/>
        <!-- arc ticks -->
        <path d="M 700 112 L 692 90 M 976 112 L 984 90
                 M 596 170 L 583 151 M 1080 170 L 1093 151
                 M 470 330 L 448 322 M 1206 330 L 1228 322
                 M 436 420 L 413 416 M 1240 420 L 1263 416"/>
        <!-- horizon -->
        <path d="M 0 533 L 1680 533" stroke-width="1.5"/>
        <!-- pitch rungs, above the horizon -->
        <path d="M 700 165 L 782 165 M 890 165 L 972 165"/>
        <path d="M 366 397 L 400 397 M 462 397 L 560 397
                 M 1112 397 L 1210 397 M 1272 397 L 1306 397"/>
        <!-- pitch rungs, below the horizon -->
        <path d="M 366 577 L 400 577 M 1272 577 L 1306 577"/>
        <path d="M 700 833 L 782 833 M 890 833 L 972 833"/>
        <path d="M 740 886 L 790 886 M 882 886 L 932 886"/>
        <!-- terrain outline either side of the horizon -->
        <path d="M 0 533 L 96 524 L 150 496 L 196 512 L 248 486 L 292 507 L 352 525 L 404 533"
              stroke-width="1.5"/>
        <path d="M 1680 533 L 1588 523 L 1534 494 L 1486 512 L 1436 487 L 1390 508 L 1330 526 L 1278 533"
              stroke-width="1.5"/>
      </g>
      <g fill="#28394F" font-family="Roboto, system-ui, sans-serif" font-size="26" text-anchor="middle">
        <text x="662" y="174">20</text>
        <text x="1008" y="174">20</text>
        <text x="430" y="406">10</text>
        <text x="1242" y="406">10</text>
        <text x="663" y="842">20</text>
        <text x="1005" y="842">20</text>
      </g>
    </svg>

    <form class="card" id="loginForm" autocomplete="off">
      <svg class="planeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"
           aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2.5 L12.9 9 L21 13.9 V16 L12.9 14.3 V18.6 L15.4 20.4 V21.5 L12 20.4 L8.6 21.5 V20.4 L11.1 18.6 V14.3 L3 16 V13.9 L11.1 9 Z"/>
      </svg>
      <h1>Flight Simulator</h1>
      <p class="sub">Enter participant details to begin</p>
      <div class="fields">
        <div class="field">
          <span class="label" id="regionLabel">Region</span>
          <div class="seg" role="radiogroup" aria-labelledby="regionLabel">
            <button type="button" class="segBtn is-on" data-region="north" aria-checked="true" role="radio">North</button>
            <button type="button" class="segBtn" data-region="south" aria-checked="false" role="radio">South</button>
          </div>
        </div>
        <div class="field">
          <label for="fullName">Full name</label>
          <input id="fullName" name="fullName" type="text" required>
        </div>
        <div class="field">
          <label for="subjectId">Participant ID</label>
          <input id="subjectId" name="subjectId" type="text" inputmode="numeric" required>
        </div>
      </div>
      <div class="err" id="loginErr"></div>
      <button type="submit" disabled>Loading map… 0%</button>
    </form>
  </div>

  <div id="pause" class="modal">
    <div class="modalCard">
      <h2 id="pauseTitle">Route paused</h2>
      <p class="modalAsk">Move on to the next route?</p>
      <div class="modalRow">
        <button type="button" id="pauseYes" class="btnPrimary">Yes</button>
        <button type="button" id="pauseNo" class="btnGhost">No</button>
      </div>
      <div class="modalRow modalRowCsv">
        <button type="button" id="pauseCsv" class="btnGhost">Download CSV</button>
      </div>
    </div>
  </div>

  <div id="finish" class="modal">
    <div class="modalCard">
      <h2>Session complete</h2>
      <p class="modalInfo" id="finishInfo"></p>
      <div class="modalRow">
        <button type="button" id="downloadCsv" class="btnPrimary">Download CSV</button>
      </div>
    </div>
  </div>

  <script type="module" src="./demo/main.ts"></script>
</body>
</html>
